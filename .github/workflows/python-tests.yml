name: Python tests

# polish-v1 (2026-10-31): replaces "Python Package using Conda", which failed on
# every push (it needed an environment.yml that this repository does not have,
# and ran pytest from the wrong folder). This runs ARIYAN's own test suite.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# ci-v2 (2026-11-02): actions moved to their Node.js 24 versions (GitHub forces
# Node 24 and removes Node 20); no change to what is built or tested.
concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ARIYAN_GEO_AI
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy scipy requests pytest   # scipy: reference only (tests compare np_ops against it)
      - name: Run the test suite
        env:
          PYTHONPATH: app/src/main/python:tests
        run: python -m pytest -q tests